name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: S3BrowserLite-${{ github.ref_name }}-windows-amd64.zip
          - os: macos-latest
            platform: darwin/universal
            asset: S3BrowserLite-${{ github.ref_name }}-macos-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cài Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Kiểm thử
        run: go test ./...
      - name: Build
        run: wails build -s -clean -platform ${{ matrix.platform }}
      - name: Đóng gói Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/S3BrowserLite.exe -DestinationPath "${{ matrix.asset }}"
      - name: Đóng gói macOS
        if: runner.os == 'macOS'
        # ditto giữ quyền thực thi và cấu trúc .app, khác với zip thường.
        run: ditto -c -k --keepParent build/bin/s3-browser-lite.app "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  package-web:
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: s3browser-web
            ext: tar.gz
          - goos: linux
            goarch: arm64
            bin: s3browser-web
            ext: tar.gz
          - goos: darwin
            goarch: amd64
            bin: s3browser-web
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            bin: s3browser-web
            ext: tar.gz
          - goos: windows
            goarch: amd64
            bin: s3browser-web.exe
            ext: zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build bản web
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o build/web/${{ matrix.bin }} ./cmd/s3browser-web
      - name: Đóng gói tar.gz
        if: matrix.ext == 'tar.gz'
        run: tar -C build/web -czf "s3browser-web-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "${{ matrix.bin }}"
      - name: Đóng gói zip
        if: matrix.ext == 'zip'
        run: (cd build/web && zip "../../s3browser-web-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "${{ matrix.bin }}")
      - uses: actions/upload-artifact@v4
        with:
          name: s3browser-web-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}
          path: s3browser-web-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}

  publish:
    needs: [package, package-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "S3 Browser Lite ${{ github.ref_name }}" \
            --notes "Bản desktop (Windows, macOS): S3BrowserLite-*.zip. Bản web (Windows, Linux, macOS; amd64 và arm64) chạy được trên máy không cài Go: giải nén rồi chạy s3browser-web, trình duyệt tự mở. Bản chưa ký: Windows có thể hiện SmartScreen (More info, Run anyway); macOS chặn lần đầu mở, bấm chuột phải vào ứng dụng rồi chọn Open (hoặc chạy xattr -cr trên .app; với bản web chạy xattr -d com.apple.quarantine s3browser-web). Bản desktop Windows yêu cầu WebView2."
